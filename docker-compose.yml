version: "3.9"

services:
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
       - "5432:5432"

  backend:
    build: ./server
    container_name: server
    depends_on:
      - db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

#  frontend:
#    build: ./frontend
#    container_name: frontend
#    ports:
#      - "3000:3000"
#    depends_on:
#      - backend

volumes:
  postgres_data: