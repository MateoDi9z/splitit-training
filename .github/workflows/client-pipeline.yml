name: Client Pipeline - CI

on:
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client-pipeline.yml"

concurrency:
  group: client-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Front (lint · format · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build