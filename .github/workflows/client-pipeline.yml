name: Client Pipeline - CI

on:
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client-pipeline.yml"

concurrency:
  group: client-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Front (lint · format · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build